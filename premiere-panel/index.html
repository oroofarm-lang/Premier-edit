<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <sp-heading size="M">Premier Edit</sp-heading>
    <sp-body id="status"><span id="status-spinner" class="spinner" hidden></span><span id="status-text">Connecting…</span></sp-body>

    <div id="premiere-block" class="block" hidden>
      <sp-detail>Premiere</sp-detail>
      <sp-body id="premiere-info"></sp-body>
    </div>

    <div class="block">
      <sp-detail>Project</sp-detail>
      <sp-picker id="project-picker" placeholder="Loading projects…">
        <sp-menu slot="options" id="project-options"></sp-menu>
      </sp-picker>
    </div>

    <div id="plan-block" class="block" hidden>
      <sp-detail>Approved cut plan</sp-detail>
      <sp-body id="plan-summary"></sp-body>
      <ul id="plan-list"></ul>
    </div>

    <div class="actions">
      <sp-button id="load-plan-button" variant="secondary">Load plan</sp-button>
      <sp-button id="build-button" variant="accent" disabled>
        Build sequence
      </sp-button>
    </div>

    <dialog id="confirm-dialog">
      <sp-heading size="S">Build sequence?</sp-heading>
      <sp-divider size="medium"></sp-divider>
      <sp-body id="confirm-text"></sp-body>
      <sp-body class="muted">
        This creates a new sequence and imports any missing source files. Your
        existing sequences are not modified.
      </sp-body>
      <div class="actions">
        <sp-button id="confirm-cancel" variant="secondary">Cancel</sp-button>
        <sp-button id="confirm-ok" variant="accent">Build</sp-button>
      </div>
    </dialog>

    <ul id="log"></ul>
  </body>
</html>
